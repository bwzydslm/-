# ============================================================================
#  wrangler.toml —— ne-relay（网易云接口中转 · Cloudflare Pages 项目）
#
#  这个文件只服务于「本地用 wrangler 跑 / 部署」这一件事，不参与主站构建。
#
#  ★ 刻意把 pages_build_output_dir 指到 public/：
#    不带函数目录时 wrangler 会当成纯静态站点，部署上去 /api/* 全是 404，
#    而 404 的表现是「前端 ping 失败 → 静默退回本地曲库」，很难看出是配错。
#
#  ★ 不做任何 secret 绑定。这个中转不需要密钥（游客 cookie 是硬编码的公开标识），
#    要加限流就在面板上给项目绑一个 KV，变量名必须是 RL（见 README「加固」）。
# ============================================================================

name = "netease-relay"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"
